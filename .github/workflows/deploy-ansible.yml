---
# Option #1 del reto: ejecutar el playbook de Ansible desde GitHub Actions.
#
# Dos jobs:
#   build  -> instala, compila y prueba la app en el runner (corre en push y en PR)
#   deploy -> despliega en el Droplet con ansible-playbook (solo push a main y manual)
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST        IP publica del Droplet
#   SERVER_USER        usuario SSH (root)
#   SERVER_SSH_KEY     clave privada SSH con acceso al Droplet
#   APP_DEPLOY_KEY     deploy key privada de GitHub para clonar el repo en el servidor
# Secrets opcionales:
#   SERVER_HOST_KEY    host key del Droplet (si no, se usa ssh-keyscan)
name: Deploy (Ansible)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ansible/**"
      - ".github/workflows/deploy-ansible.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "ansible/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o tag a desplegar"
        required: false
        default: "main"

concurrency:
  group: deploy-ansible-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Construir la aplicacion
        working-directory: app
        run: npm run build

      - name: Comprobar la sintaxis del bundle
        working-directory: app
        run: node --check dist/index.js

      - name: Arrancar la app y comprobar la respuesta
        working-directory: app
        run: |
          set -euo pipefail
          PORT=3000 node dist/index.js &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:3000/ | grep -q "Hello, world!"; then
              echo "OK: la app responde en /"
              curl -fsS http://127.0.0.1:3000/healthz
              exit 0
            fi
            sleep 2
          done
          echo "::error::La app no respondio en el runner"
          exit 1

  deploy:
    name: Deploy with ansible-playbook
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible --version

      - name: Instalar las colecciones de Ansible
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Preparar la clave SSH del servidor
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy_server
          chmod 600 ~/.ssh/id_deploy_server

      - name: Registrar la host key del servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          if [ -n "$SERVER_HOST_KEY" ]; then
            printf '%s\n' "$SERVER_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Generar el inventario
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          cat > ansible/inventory.ini <<EOF
          [app]
          web-1 ansible_host=${SERVER_HOST} ansible_user=${SERVER_USER} ansible_ssh_private_key_file=~/.ssh/id_deploy_server

          [app:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF
          cat ansible/inventory.ini

      - name: Ejecutar ansible-playbook
        working-directory: ansible
        env:
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          APP_REPO="https://github.com/${GITHUB_REPO}.git"
          DEPLOY_KEY_ARGS=()
          if [ -n "${APP_DEPLOY_KEY}" ]; then
            APP_REPO="git@github.com:${GITHUB_REPO}.git"
            DEPLOY_KEY_ARGS=(--extra-vars "app_deploy_key=${APP_DEPLOY_KEY}")
          fi
          ansible-playbook node_service.yml --tags app \
            --extra-vars "app_repo=${APP_REPO}" \
            "${DEPLOY_KEY_ARGS[@]}" \
            --extra-vars "app_commit=${DEPLOY_REF}"

      - name: Verificar la aplicacion desplegada
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            if curl -fsS "http://${SERVER_HOST}/" | grep -q "Hello, world!"; then
              echo "La aplicacion responde correctamente en http://${SERVER_HOST}/"
              exit 0
            fi
            echo "Intento ${i}: la aplicacion aun no responde, reintentando..."
            sleep 5
          done
          echo "::error::La aplicacion no responde en http://${SERVER_HOST}/"
          exit 1
