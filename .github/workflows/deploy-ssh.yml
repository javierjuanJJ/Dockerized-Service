---
# Option #2 del reto: desplegar por SSH con rsync + appleboy/ssh-action.
#
# No necesita Ansible en el runner: el codigo se copia con rsync (con la clave
# cargada por webfactory/ssh-agent) y el servicio se reinicia con appleboy/ssh-action.
#
# Dos jobs:
#   build  -> instala, compila y prueba la app en el runner (corre en push y en PR)
#   deploy -> sincroniza con rsync y reinicia el servicio en el Droplet
#             (solo push a main y manual)
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST        IP publica del Droplet
#   SERVER_USER        usuario SSH (root en la imagen de DigitalOcean)
#   SERVER_SSH_KEY     clave privada SSH con acceso al Droplet
#   SERVER_FINGERPRINT huella SHA256 del host (recomendado, evita ataques MITM)
#
# Nota: en el servidor se necesita Node.js. Si aun no esta instalado, el script de
# despliegue lo instala desde NodeSource la primera vez (sudo).
name: Deploy (SSH + rsync)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-ssh.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o tag a desplegar"
        required: false
        default: "main"

concurrency:
  group: deploy-ssh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Construir la aplicacion
        working-directory: app
        run: npm run build

      - name: Comprobar la sintaxis del bundle
        working-directory: app
        run: node --check dist/index.js

      - name: Arrancar la app y comprobar la respuesta
        working-directory: app
        run: |
          set -euo pipefail
          PORT=3000 node dist/index.js &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:3000/ | grep -q "Hello, world!"; then
              echo "OK: la app responde en /"
              curl -fsS http://127.0.0.1:3000/healthz
              exit 0
            fi
            sleep 2
          done
          echo "::error::La app no respondio en el runner"
          exit 1

  deploy:
    name: Deploy with rsync + ssh
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Fijar la host key del servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Cargar la clave SSH en el agente
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Sincronizar el codigo con el servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            app/ "${SERVER_USER}@${SERVER_HOST}:/tmp/node-service-release/"

      - name: Construir y reiniciar el servicio en el servidor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          port: 22
          envs: APP_DIR=app,APP_PORT=80,SERVER_USER=${{ secrets.SERVER_USER }}
          script: |
            set -euo pipefail
            RELEASE_DIR=/tmp/node-service-release
            TARGET_DIR=/opt/${APP_DIR}

            if ! command -v rsync > /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq rsync
            fi

            if ! command -v node > /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y -qq nodejs
            fi

            sudo mkdir -p "$TARGET_DIR"
            sudo rsync -a --delete "$RELEASE_DIR/" "$TARGET_DIR/"

            cd "$TARGET_DIR"
            sudo npm ci --omit=dev
            sudo npm run build

            if ! sudo systemctl cat node-service > /dev/null 2>&1; then
              cat > /tmp/node-service.service <<UNIT
            [Unit]
            Description=Node.js service (Hello, world!)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=${SERVER_USER}
            WorkingDirectory=${TARGET_DIR}
            Environment=NODE_ENV=production
            Environment=PORT=${APP_PORT}
            ExecStart=/usr/bin/node ${TARGET_DIR}/dist/index.js
            Restart=always
            RestartSec=5
            StandardOutput=journal
            StandardError=journal
            NoNewPrivileges=true
            PrivateTmp=true
            AmbientCapabilities=CAP_NET_BIND_SERVICE
            CapabilityBoundingSet=CAP_NET_BIND_SERVICE

            [Install]
            WantedBy=multi-user.target
            UNIT
              sudo install -m 0644 /tmp/node-service.service /etc/systemd/system/node-service.service
              rm -f /tmp/node-service.service
              sudo systemctl daemon-reload
            fi

            sudo systemctl enable node-service
            sudo systemctl restart node-service
            sudo systemctl is-active --quiet node-service

      - name: Verificar la aplicacion desplegada
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            if curl -fsS "http://${SERVER_HOST}/" | grep -q "Hello, world!"; then
              echo "La aplicacion responde correctamente en http://${SERVER_HOST}/"
              exit 0
            fi
            echo "Intento ${i}: la aplicacion aun no responde, reintentando..."
            sleep 5
          done
          echo "::error::La aplicacion no responde en http://${SERVER_HOST}/"
          exit 1