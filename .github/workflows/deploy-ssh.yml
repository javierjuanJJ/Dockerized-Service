---
# Despliegue alternativo sin Ansible: publica la imagen en ghcr.io y la despliega
# por SSH con `docker login` + `docker compose up`.
#
# Útil cuando no quieres (o no puedes) mantener Ansible en el runner: el propio
# script de despliegue genera el docker-compose.yml y el .env en el servidor.
# El camino con Ansible está en `deploy.yml`, que es el recomendado.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
#   GHCR_USERNAME, GHCR_READ_TOKEN
#   APP_SECRET_MESSAGE, APP_USERNAME, APP_PASSWORD
name: Deploy (GHCR + SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

concurrency:
  group: deploy-ssh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Construir y publicar la imagen
    uses: ./.github/workflows/build-push.yml
    with:
      push: ${{ github.event_name != 'pull_request' }}

  deploy:
    name: Desplegar el contenedor por SSH
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Calcular la referencia de la imagen
        id: image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          echo "ref=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Fijar la host key del servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Cargar la clave SSH en el agente
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # Se escriben el compose y el .env directamente en el servidor. Los
      # secretos viajan por el canal SSH cifrado y se guardan con permisos 0600:
      # nunca pasan por el repositorio ni por la imagen.
      - name: Desplegar el servicio en el servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          APP_SECRET_MESSAGE: ${{ secrets.APP_SECRET_MESSAGE }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GHCR_URL: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SERVER_USER" || { echo "::error::Falta el secret SERVER_USER"; exit 1; }

          # El .env se genera en local con permisos 0600 y se transfiere por SSH.
          install -m 600 /dev/null app.env
          cat > app.env <<EOF
          SECRET_MESSAGE='${APP_SECRET_MESSAGE}'
          USERNAME='${APP_USERNAME}'
          PASSWORD='${APP_PASSWORD}'
          EOF

          # El compose se genera en local para poder versionarlo en el futuro.
          cat > docker-compose.yml <<EOF
          services:
            node-service:
              image: ${APP_IMAGE}
              container_name: node-service
              restart: unless-stopped
              pull_policy: always
              env_file:
                - /srv/node-service/.env
              ports:
                - "80:3000"
              logging:
                driver: json-file
                options:
                  max-size: 10m
                  max-file: "3"
              security_opt:
                - no-new-privileges:true
          EOF

          ssh "${SERVER_USER}@${SERVER_HOST}" 'sudo mkdir -p /srv/node-service'
          scp -q app.env "${SERVER_USER}@${SERVER_HOST}:/tmp/app.env"
          scp -q docker-compose.yml "${SERVER_USER}@${SERVER_HOST}:/tmp/docker-compose.yml"

          # El login al registro se hace en el servidor con un PAT de solo
          # lectura. El GITHUB_TOKEN del runner no se comparte con el servidor.
          printf '%s' "$GHCR_READ_TOKEN" | ssh "${SERVER_USER}@${SERVER_HOST}" \
            "sudo docker login --username '${GHCR_USERNAME}' --password-stdin ${GHCR_URL}"

          ssh "${SERVER_USER}@${SERVER_HOST}" bash -s <<REMOTE
          set -euo pipefail
          sudo install -m 600 -o root -g root /tmp/app.env /srv/node-service/.env
          sudo install -m 644 -o root -g root /tmp/docker-compose.yml /srv/node-service/docker-compose.yml
          rm -f /tmp/app.env /tmp/docker-compose.yml
          cd /srv/node-service
          sudo docker compose pull --quiet node-service
          sudo docker compose up -d --remove-orphans --no-build node-service
          sudo docker image prune --force --filter until=168h || true
          REMOTE

          rm -f app.env

      - name: Verificar la aplicacion desplegada
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            if curl -fsS "http://${SERVER_HOST}/" | grep -q "Hello, world!"; then
              echo "OK: / responde en http://${SERVER_HOST}/"
              break
            fi
            echo "Intento ${i}: la aplicacion aun no responde, reintentando..."
            sleep 5
          done

          curl -fsS "http://${SERVER_HOST}/" | grep -q "Hello, world!"

          code="$(curl -s -o /dev/null -w '%{http_code}' "http://${SERVER_HOST}/secret")"
          if [ "$code" != "401" ]; then
            echo "::error::Se esperaba 401 en /secret sin credenciales, llego ${code}"
            exit 1
          fi

          curl -fsS -u "${APP_USERNAME}:${APP_PASSWORD}" "http://${SERVER_HOST}/secret"
          echo "OK: /secret protegido con Basic Auth en produccion"
