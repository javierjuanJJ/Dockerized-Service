---
# Task #1: despliegue manual de la aplicacion Node.js
#
#   ansible-playbook node_service.yml --tags app
#
# El grupo [app] apunta al Droplet creado con Terraform (ver inventory.ini).
- name: Desplegar el servicio Node.js
  hosts: app
  become: true
  gather_facts: true

  roles:
    - role: app
      tags: app
