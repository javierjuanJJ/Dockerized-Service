---
# Valores por defecto del rol `app` (despliegue del servicio Docker).
# Se pueden sobreescribir sin editar el rol:
#   ansible-playbook node_service.yml --tags app -e app_image=ghcr.io/OWNER/node-service:v1

# Donde vive la configuracion del servicio en el servidor
app_dir: /srv/node-service
app_compose_project: node-service
app_healthcheck_path: /healthz

# Imagen a desplegar. La construye y publica el workflow de GitHub Actions.
app_image: ghcr.io/OWNER/node-service:latest
app_image_pull_policy: always      # always | missing | never

# Puertos: el contenedor escucha en 3000 (no root, no puede usar puertos
# privilegiados) y el puerto 80 se publica desde el host.
app_host_port: 80
app_container_port: 3000

app_restart_policy: unless-stopped
app_log_max_size: 10m
app_log_max_files: "3"

# Secretos de la aplicacion. Se escriben en app_env_file en el servidor con
# permisos 0600 y NUNCA se imprimen en la salida de Ansible (no_log).
#
# Recomendado: no ponerlos aqui en claro, sino pasarlos desde un fichero
# cifrado con `ansible-vault`:
#   ansible-vault encrypt group_vars/all/vault.yml
#   ansible-playbook node_service.yml -e @group_vars/all/vault.yml
app_env:
  SECRET_MESSAGE: "change-me"
  USERNAME: "change-me"
  PASSWORD: "change-me"
app_env_file: "{{ app_dir }}/.env"

# Credenciales del registro de contenedores (GHCR). Si se dejan vacias, el
# servidor solo puede tirar de imagenes publicas.
app_registry_url: ""
app_registry_username: ""
app_registry_password: ""
app_registry_auth_file: /root/.docker/config.json

# Instalacion de Docker desde los repositorios de la distribucion.
docker_packages:
  - docker.io
  - docker-compose-v2
