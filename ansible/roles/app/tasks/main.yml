---
# Despliega el servicio Node.js como contenedor Docker.
#
# El servidor NO compila nada: la imagen la construye y publica el workflow de
# GitHub Actions y aqui solo se descarga y arranca. Esto mantiene el servidor
# libre de toolchain (ni Node.js ni npm) y hace el despliegue reproducible.

- name: Instalar Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: app_docker_install

- name: Comprobar la version de Docker
  ansible.builtin.command: docker --version
  register: app_docker_version
  changed_when: false

- name: Comprobar la version de Docker Compose
  ansible.builtin.command: docker compose version
  register: app_compose_plugin
  changed_when: false
  failed_when: false

- name: Usar el plugin de compose (docker compose)
  ansible.builtin.set_fact:
    app_compose_cmd: "docker compose"
  when: app_compose_plugin.rc == 0

- name: Usar el binario docker-compose (compose v1)
  ansible.builtin.set_fact:
    app_compose_cmd: "docker-compose"
  when: app_compose_plugin.rc != 0

- name: Mostrar las versiones detectadas
  ansible.builtin.debug:
    msg: "{{ app_docker_version.stdout }} | compose via `{{ app_compose_cmd }}`"

- name: Crear el directorio de despliegue
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# El fichero de secretos vive en el servidor con permisos 0600: solo root puede
# leerlo y nunca se incluye en la imagen ni en el repositorio.
- name: Recopilar el estado de los servicios del sistema
  ansible.builtin.service_facts:

# El playbook `site.yml` (opcional) deja nginx sirviendo el puerto 80. El
# contenedor publica tambien el 80, asi que hay que liberar el puerto o
# `docker compose up` fallara con "port is already allocated".
- name: Liberar el puerto 80 si nginx lo ocupa
  ansible.builtin.systemd_service:
    name: nginx
    state: stopped
    enabled: false
  when:
    - app_host_port == 80
    - ansible_facts.services.get('nginx.service') is defined

- name: Escribir el fichero de entorno con los secretos
  ansible.builtin.copy:
    dest: "{{ app_env_file }}"
    # Comillas simples: los valores pueden contener comillas dobles y espacios
    # sin romperse (docker compose las interpreta como literales).
    content: |
      # Gestionado por Ansible. No editar a mano.
      {% for key, value in app_env.items() %}
      {{ key }}='{{ value }}'
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: app_env_write

# Autenticacion en el registro (GHCR). La credencial queda en el home de root y
# solo se usa para descargar la imagen.
- name: Autenticarse en el registro de contenedores
  ansible.builtin.command:
    # --password-stdin evita que la contrasena aparezca en el historial o en ps.
    cmd: >-
      docker login
      --username {{ app_registry_username }}
      --password-stdin
      {{ app_registry_url }}
    stdin: "{{ app_registry_password }}"
  environment:
    DOCKER_CONFIG: "{{ app_registry_auth_file | dirname }}"
  when:
    - app_registry_url | length > 0
    - app_registry_username | length > 0
  changed_when: true
  no_log: true

- name: Instalar el fichero compose del servicio
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  register: app_compose_file

- name: Descargar la imagen desde el registro
  ansible.builtin.command:
    cmd: "{{ app_compose_cmd }} pull --quiet {{ app_compose_project }}"
    chdir: "{{ app_dir }}"
  environment:
    DOCKER_CONFIG: "{{ app_registry_auth_file | dirname }}"
  register: app_pull
  changed_when: true

- name: Arrancar o actualizar el contenedor
  ansible.builtin.command:
    cmd: >-
      {{ app_compose_cmd }} up -d --remove-orphans --no-build
      {{ app_compose_project }}
    chdir: "{{ app_dir }}"
  register: app_up
  changed_when: true

# Limpia imagenes huerfanas para que el disco del servidor no crezca sin limite.
- name: Eliminar imagenes de Docker sin usar
  ansible.builtin.command: docker image prune --force --filter until=168h
  register: app_prune
  changed_when: "'Total reclaimed space: 0B' not in app_prune.stdout"
  failed_when: false

- name: Esperar a que el contenedor responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_host_port }}{{ app_healthcheck_path }}"
    status_code: 200
    return_content: true
  register: app_healthcheck
  retries: 12
  delay: 5
  until: app_healthcheck is succeeded

- name: Mostrar el resultado del despliegue
  ansible.builtin.debug:
    msg: >-
      {{ app_compose_project }} desplegado con la imagen {{ app_image }}
      ({{ app_healthcheck.json.status }}) en el puerto {{ app_host_port }}
