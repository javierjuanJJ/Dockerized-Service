---
- name: Instalar python3-debian (requisito de deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Registrar el repositorio de NodeSource
  ansible.builtin.deb822_repository:
    name: nodesource
    description: "Node.js Source"
    types:
      - deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_version }}"
    suites: nodistro
    components:
      - main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: app_nodesource
  # Reintenta: si el repositorio se acaba de anadir, apt aun puede fallar por cache
  retries: 3
  delay: 5
  until: app_nodesource is succeeded

- name: Actualizar la cache de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: app_nodesource is changed

- name: Instalar Node.js y npm
  ansible.builtin.apt:
    name:
      - nodejs
    state: present
  register: app_node_install

- name: Comprobar la version de Node.js instalada
  ansible.builtin.command: node --version
  register: app_node_version
  changed_when: false

- name: Comprobar la version de npm instalada
  ansible.builtin.command: npm --version
  register: app_npm_version
  changed_when: false

- name: Mostrar las versiones instaladas
  ansible.builtin.debug:
    msg: "Node.js {{ app_node_version.stdout }} | npm {{ app_npm_version.stdout }}"

- name: Crear el grupo y el usuario de la aplicacion
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "/home/{{ app_user }}"
    shell: /bin/bash
    system: true
    create_home: true
    state: present

- name: Crear el directorio de despliegue
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Crear el directorio .ssh del usuario de despliegue
  ansible.builtin.file:
    path: "/home/{{ app_user }}/.ssh"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0700"
  when: app_repo is match('^git@')

- name: Instalar la clave publica del runner de GitHub Actions
  ansible.builtin.copy:
    dest: "/home/{{ app_user }}/.ssh/authorized_keys"
    content: "{{ app_runner_ssh_public_key }}\n"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  when: app_runner_ssh_public_key | length > 0

- name: Instalar la deploy key privada en el servidor
  ansible.builtin.copy:
    dest: "{{ app_deploy_key_path }}"
    content: "{{ app_deploy_key }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  no_log: true
  when: app_deploy_key | length > 0

- name: Fijar el host de GitHub para evitar prompts de known_hosts
  ansible.builtin.copy:
    dest: "/home/{{ app_user }}/.ssh/known_hosts"
    content: "{{ app_known_hosts }}\n"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  when: app_repo is match('^git@')

- name: Dar a git la ruta de la deploy key
  ansible.builtin.copy:
    dest: "/home/{{ app_user }}/.gitconfig"
    content: |
      [safe]
      	default = *
      [core]
      	sshCommand = ssh -i {{ app_deploy_key_path }} -o IdentitiesOnly=yes
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  when:
    - app_repo is match('^git@')
    - app_deploy_key | length > 0

- name: Clonar o actualizar el repositorio
  become_user: "{{ app_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}/app"
    version: "{{ app_commit | default(app_branch, true) }}"
    force: "{{ app_repo_force_update }}"
    accept_hostkey: true
    # Clon superficial para desplegar una rama; historial completo para fixear un sha
    depth: "{{ 0 if (app_commit | length > 0) else 1 }}"
  register: app_clone

- name: Instalar las dependencias de produccion
  become_user: "{{ app_user }}"
  community.general.npm:
    path: "{{ app_dir }}/app"
    state: present
    production: true
    ci: true
  when: app_clone is changed
  register: app_npm_install

- name: Construir la aplicacion
  become_user: "{{ app_user }}"
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_dir }}/app"
  when: app_clone is changed
  changed_when: true
  register: app_build

- name: Recopilar el estado de los servicios del sistema
  ansible.builtin.service_facts:

- name: Apagar nginx si viene instalado del proyecto anterior (compite por el puerto 80)
  ansible.builtin.systemd_service:
    name: nginx
    state: stopped
    enabled: false
  when:
    - app_port == 80
    - ansible_facts.services.get('nginx.service') is defined

- name: Instalar la unidad systemd del servicio
  ansible.builtin.template:
    src: node-service.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: app_unit

- name: Habilitar el servicio en el arranque
  ansible.builtin.systemd_service:
    name: "{{ app_service_name }}"
    enabled: true

# El reinicio se hace como tarea y no como handler: asi ocurre antes del healthcheck
- name: Reiniciar el servicio si algo cambio
  ansible.builtin.systemd_service:
    name: "{{ app_service_name }}"
    state: restarted
    daemon_reload: true
  when: >-
    app_unit is changed or
    app_clone is changed or
    app_npm_install is changed or
    app_build is changed or
    app_node_install is changed

- name: Esperar a que el servicio responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_healthcheck_path }}"
    status_code: 200
    return_content: true
  register: app_healthcheck
  retries: 10
  delay: 3
  until: app_healthcheck is succeeded

- name: Mostrar el resultado del despliegue
  ansible.builtin.debug:
    msg: "{{ app_service_name }} desplegado en el puerto {{ app_port }} ({{ app_healthcheck.json.status }})"
